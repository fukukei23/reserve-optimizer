name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  root-test:
    name: Root Unit/E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # テスト増加時のインフラタイムアウトflake予防（MLR起票⑤・2026-09-10）
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  worker-test:
    name: Worker Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Run tests
        working-directory: worker
        run: npm test
