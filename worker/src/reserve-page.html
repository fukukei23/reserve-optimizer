<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web予約</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#333;max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;text-align:center;padding:16px 0;border-bottom:2px solid #06c755}
.step{display:none;background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.step.active{display:block}
.step-title{font-size:1rem;font-weight:700;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:6px 0;border:2px solid #06c755;border-radius:8px;background:#fff;color:#06c755;font-size:1rem;font-weight:600;cursor:pointer;text-align:center}
.btn:hover,.btn.selected{background:#06c755;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#06c755;color:#fff}
.btn-primary:hover{background:#05a84a}
input{width:100%;padding:14px;border:2px solid #ddd;border-radius:8px;font-size:1rem;margin:6px 0}
input:focus{outline:none;border-color:#06c755}
.slot-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slot-btn{padding:12px;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;text-align:center;font-size:.9rem}
.slot-btn:hover,.slot-btn.selected{border-color:#06c755;background:#e8f5ee}
.slot-btn.full{opacity:.3;cursor:not-allowed}
.confirm-box{background:#f0faf4;border-radius:8px;padding:16px;margin:12px 0}
.confirm-box p{margin:4px 0;font-size:.9rem}
.error{color:#d32f2f;font-size:.9rem;margin:8px 0}
.progress{display:flex;justify-content:center;gap:8px;margin:12px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#ddd}
.dot.active{background:#06c755}
#lang-switcher button{padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:.8rem}
#lang-switcher button[aria-pressed="true"]{background:#06c755;color:#fff;border-color:#06c755}
</style>
</head>
<body>
<h1 data-i18n="page.title">Web予約</h1>
<div id="lang-switcher" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;"></div>
<div class="progress" id="progress"></div>

<div class="step active" id="step1">
  <div class="step-title" data-i18n="step1.title">Step 1: 施術を選択</div>
  <div id="treatment-list"></div>
</div>

<div class="step" id="step2">
  <div class="step-title" data-i18n="step2.title">Step 2: 日付を選択</div>
  <input type="date" id="date-input">
  <div class="error" id="date-error"></div>
  <button class="btn btn-primary" id="date-next" data-i18n="btn.check_slots">空き枠を確認</button>
  <button class="btn" id="date-back" data-i18n="btn.back">戻る</button>
</div>

<div class="step" id="step3">
  <div class="step-title" data-i18n="step3.title">Step 3: 時間を選択</div>
  <div class="slot-grid" id="slot-list"></div>
  <div class="error" id="slot-error"></div>
  <button class="btn" id="slot-back" data-i18n="btn.back">戻る</button>
</div>

<div class="step" id="step4">
  <div class="step-title" data-i18n="step4.title">Step 4: お客様情報</div>
  <input type="text" id="name-input" placeholder="お名前" data-i18n-attr="placeholder:placeholder.name">
  <input type="tel" id="phone-input" placeholder="電話番号（09012345678）" data-i18n-attr="placeholder:placeholder.phone">
  <div class="error" id="info-error"></div>
  <button class="btn btn-primary" id="info-next" data-i18n="btn.to_confirm">確認画面へ</button>
  <button class="btn" id="info-back" data-i18n="btn.back">戻る</button>
</div>

<div class="step" id="step5">
  <div class="step-title" data-i18n="step5.title">予約内容の確認</div>
  <div class="confirm-box" id="confirm-details"></div>
  <button class="btn btn-primary" id="confirm-submit" data-i18n="btn.submit">予約する</button>
  <button class="btn" id="confirm-back" data-i18n="btn.back">戻る</button>
  <div class="error" id="confirm-error"></div>
</div>

<div class="step" id="step-done">
  <div class="step-title" style="color:#06c755" data-i18n="step6.title">予約完了</div>
  <p id="done-msg"></p>
</div>

    return code;

  var SUPPORTED = {

    ko: ["ko"],
    pt: ["pt-BR","pt-PT","pt"],
    es: ["es-AR","es-MX","es-ES","es"]
  };
  var SUPPORTED_KEYS = ["ja","en","zh","ko","pt","es"];

  function detectLang(stored, navLangs) {
    // 1. localStorage 値（例外時は stored===null）
    if (stored && SUPPORTED_KEYS.indexOf(stored) !== -1) return stored;
    // 2. navigator.languages 完全一致
    var langs = navLangs || [];
    for (var i = 0; i < langs.length; i++) {
      var l = langs[i];
      for (var k = 0; k < SUPPORTED_KEYS.length; k++) {
        var key = SUPPORTED_KEYS[k];
        if (SUPPORTED[key].indexOf(l) !== -1) return key;
      }
    }
    // 3. 接頭辞一致
    for (var i2 = 0; i2 < langs.length; i2++) {
      var pfx = (langs[i2] || "").split("-")[0];
      if (SUPPORTED_KEYS.indexOf(pfx) !== -1) return pfx;
    }
    // 4. en フォールバック（SUPPORTED 外言語）
    if (langs.length > 0) return "en";
    // 5. 最終 ja
    return "ja";
  }

  __test.SUPPORTED = SUPPORTED;
  __test.detectLang = detectLang;

  var currentLang = "ja";

  function render() {
    // テキスト
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(currentLang, nodes[i].getAttribute("data-i18n"));
    }
    // 属性
    var attrNodes = document.querySelectorAll("[data-i18n-attr]");
    for (var j = 0; j < attrNodes.length; j++) {
      var pairs = (attrNodes[j].getAttribute("data-i18n-attr") || "").split(";");
      for (var k = 0; k < pairs.length; k++) {
        var parts = pairs[k].split(":");
        if (parts.length === 2) {
          attrNodes[j].setAttribute(parts[0].trim(), t(currentLang, parts[1].trim()));
        }
      }
    }
    document.documentElement.lang = currentLang;
    document.title = t(currentLang, "page.title");
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem("reserve_lang", lang); } catch (e) { /* プライベートモード等 */ }
    render();
    renderSwitcher();
  }

  var LANG_LABELS = { ja:"日本語", en:"EN", zh:"中文", ko:"한국어", pt:"PT", es:"ES" };
  function renderSwitcher() {
    var sw = document.getElementById("lang-switcher");
    if (!sw) return;
    // innerHTML 代入でなく removeChild で安全クリア（XSS 回避）
    while (sw.firstChild) sw.removeChild(sw.firstChild);
    SUPPORTED_KEYS.forEach(function(key) {
      var b = document.createElement("button");
      b.setAttribute("data-lang", key);
      b.setAttribute("role", "button");
      b.setAttribute("aria-pressed", String(key === currentLang));
      b.setAttribute("aria-label", "Language");
      b.textContent = LANG_LABELS[key];
      b.addEventListener("click", function() { setLang(key); });
      sw.appendChild(b);
    });
  }

  __test.setLang = setLang;
  __test.render = render;
  __test.getCurrentLang = function() { return currentLang; };
  __test.renderSwitcher = renderSwitcher;

    currentStep = n;
    for (var i = 1; i <= 5; i++) {
      var el = document.getElementById("step" + i);
      if (el) el.className = i === n ? "step active" : "step";
    }
    var doneEl = document.getElementById("step-done");
    if (doneEl) doneEl.className = n === 6 ? "step active" : "step";
    updateProgress();
  }

  function updateProgress() {
    var p = document.getElementById("progress");
    while (p.firstChild) p.removeChild(p.firstChild);
    for (var i = 1; i <= 4; i++) {
      var dot = document.createElement("div");
      dot.className = "dot" + (i <= currentStep ? " active" : "");
      p.appendChild(dot);
    }
  }

  function setError(id, msg) {
    var el = document.getElementById(id);
    if (el) el.textContent = msg;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  // Step 1: treatment buttons
  var list = document.getElementById("treatment-list");
  treatments.forEach(function(tr) {
    var btn = document.createElement("button");
    btn.className = "btn";
    btn.setAttribute("data-i18n", tr.key);
    btn.textContent = t(currentLang, tr.key);
    btn.addEventListener("click", function() {
      selected.treatment = tr.ja;  // GASへは日本語統一送信（予約管理者が日本語で閲覧）
      showStep(2);
    });
    list.appendChild(btn);
  });

  // Step 2: date
  var today = new Date();
  var maxDate = new Date(today.getTime() + 90 * 86400000);
  var dateInput = document.getElementById("date-input");
  dateInput.min = today.toISOString().split("T")[0];
  dateInput.max = maxDate.toISOString().split("T")[0];

  document.getElementById("date-next").addEventListener("click", function() {
    setError("date-error", "");
    var val = dateInput.value;
    if (!val) { setError("date-error", t(currentLang, "error.date_required")); return; }
    selected.date = val.replace(/-/g, "/");
    fetchSlots();
  });
  document.getElementById("date-back").addEventListener("click", function() { showStep(1); });

  function fetchSlots() {
    var slotList = document.getElementById("slot-list");
    clearChildren(slotList);
    var loading = document.createElement("div");
    loading.textContent = t(currentLang, "slots.loading");
    slotList.appendChild(loading);
    showStep(3);

    fetch("/api/availability", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: selected.date })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      clearChildren(slotList);
      if (data.ok === false) { setError("slot-error", tError(currentLang, data.code || "ERR_GENERIC")); return; }
      var slots = data.slots || [];
      if (slots.length === 0) { setError("slot-error", t(currentLang, "error.no_slots")); return; }
      slots.forEach(function(s) {
        var btn = document.createElement("button");
        btn.className = "slot-btn" + (s.available ? "" : " full");
        btn.textContent = s.time;
        btn.disabled = !s.available;
        if (s.available) {
          btn.addEventListener("click", function() {
            selected.time = s.time;
            var allBtns = document.querySelectorAll(".slot-btn");
            for (var k = 0; k < allBtns.length; k++) { allBtns[k].classList.remove("selected"); }
            btn.classList.add("selected");
            setTimeout(function() { showStep(4); }, 300);
          });
        }
        slotList.appendChild(btn);
      });
    })
    .catch(function() { setError("slot-error", t(currentLang, "error.fetch_failed")); });
  }

  document.getElementById("slot-back").addEventListener("click", function() { showStep(2); });

  // Step 4: name/phone
  document.getElementById("info-next").addEventListener("click", function() {
    setError("info-error", "");
    var name = document.getElementById("name-input").value.trim();
    var phone = document.getElementById("phone-input").value.trim();
    if (!name) { setError("info-error", t(currentLang, "error.name_required")); return; }
    if (!phone || !/^\d{10,11}$/.test(phone.replace(/[-\s]/g, ""))) {
      setError("info-error", t(currentLang, "error.phone_invalid")); return;
    }
    selected.name = name;
    selected.phone = phone.replace(/[-\s]/g, "");
    showConfirm();
  });
  document.getElementById("info-back").addEventListener("click", function() { showStep(3); });

  function showConfirm() {
    showStep(5);
    var box = document.getElementById("confirm-details");
    clearChildren(box);
    var items = [
      [t(currentLang, "confirm.treatment"), selected.treatment],
      [t(currentLang, "confirm.date"), selected.date],
      [t(currentLang, "confirm.time"), selected.time],
      [t(currentLang, "confirm.name"), selected.name],
      [t(currentLang, "confirm.phone"), selected.phone]
    ];
    items.forEach(function(item) {
      var p = document.createElement("p");
      var strong = document.createElement("strong");
      strong.textContent = item[0] + ": ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(item[1]));
      box.appendChild(p);
    });
  }

  document.getElementById("confirm-back").addEventListener("click", function() { showStep(4); });

  document.getElementById("confirm-submit").addEventListener("click", function() {
    setError("confirm-error", "");
    var btn = document.getElementById("confirm-submit");
    btn.disabled = true;
    btn.textContent = t(currentLang, "btn.submitting");
    fetch("/api/reserve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: selected.name,
        phone: selected.phone,
        date: selected.date,
        time: selected.time,
        treatment: selected.treatment
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok === false) {
        // currentLang 再読み（in-flight APIと言語切替競合対策・spec §3.5）
        var msg = tError(currentLang, data.code || "ERR_GENERIC");
        if (data.code === "ERR_MISSING_FIELDS" && data.fields && data.fields.length) {
          msg += " (" + data.fields.map(function(f) { return t(currentLang, "fields." + f); }).join(", ") + ")";
        }
        setError("confirm-error", msg);
        btn.disabled = false;
        btn.textContent = t(currentLang, "btn.submit");
        return;
      }
      showStep(6);
      document.getElementById("done-msg").textContent =
        t(currentLang, "done.prefix") + (data.reservation_id || "") + t(currentLang, "done.suffix");
    })
    .catch(function() {
      setError("confirm-error", t(currentLang, "error.reserve_failed"));
      btn.disabled = false;
      btn.textContent = t(currentLang, "btn.submit");
    });
  });

  currentLang = detectLang(
    (function(){ try { return localStorage.getItem("reserve_lang"); } catch(e){ return null; } })(),
    navigator.languages
  );
  render();
  renderSwitcher();
  updateProgress();
  window.ReserveI18n = __test;
})();
</script>
</body>
</html>
