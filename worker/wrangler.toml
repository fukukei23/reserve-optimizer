name = "reserve-optimizer"
main = "src/index.ts"
compatibility_date = "2024-05-06"

[vars]
# GAS_WEBAPP_URL は .dev.vars または wrangler secret で設定
ALLOWED_ORIGINS = "https://reserve-optimizer.fukukei44161.workers.dev"

# ─── C1: D1 binding (spec §4 C1) ───
# 実DB作成済み（2026-10-09・region APAC・d1 create実測）
[[d1_databases]]
binding = "DB"
database_name = "reserve-optimizer"
database_id = "247f0b72-4292-42ee-8476-b50394dc654c"

[[rules]]
type = "Text"
globs = ["**/*.html"]

# ─── Phase α demo environment (spec E11) ───
# deploy:  cd worker && npx wrangler deploy --env demo
# secrets: npx wrangler secret put --env demo <NAME>
#   必須: GAS_WEBAPP_URL / GAS_AUTH_TOKEN / STRIPE_WEBHOOK_SECRET / LINE_CHANNEL_SECRET / WEB_API_KEY
# 詳細: docs/runbooks/demo-deploy.md
[env.demo]
name = "reserve-optimizer-demo"
[env.demo.vars]
# TODO: deploy 後の実 demo origin 確定で書き換え（現状は推定URL）
ALLOWED_ORIGINS = "https://reserve-optimizer-demo.fukukei44161.workers.dev"
DEMO_MODE = "true"
